<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENE Live2D Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="live2d-canvas"></canvas>
    <div id="overlay-notice-stack" aria-live="polite">
        <div id="token-usage-bubble" class="hidden"></div>
        <div id="promise-notice-bubble" class="hidden"></div>
    </div>

    <!-- 채팅 UI -->
    <div id="chat-container">
        <div id="chat-resize-handle" role="separator" aria-label="채팅창 높이 조절" aria-orientation="horizontal"></div>
        <div id="chat-messages"></div>

        <!-- 로딩 인디케이터 -->
        <div id="loading-indicator" class="message assistant" style="display: none;" aria-live="polite">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-text">생각중...</span>
        </div>

        <!-- 이미지 미리보기 영역 -->
        <div id="image-preview-container"></div>

        <div id="chat-input-wrapper">
            <!-- 첨부 버튼 -->
            <button id="attach-button" type="button" title="파일 첨부" aria-label="파일 첨부">
                <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551" />
                </svg>
            </button>
            <input type="file" id="image-input" accept="image/*,.txt,.md,.pdf,.docx" multiple hidden>

            <textarea id="chat-input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
            <button id="send-button">전송</button>
        </div>
    </div>

    <div id="floating-action-buttons">
        <button id="floating-actions-toggle" type="button" title="빠른 메뉴" aria-label="빠른 메뉴" aria-expanded="false">···</button>
        <div id="floating-actions-menu" aria-hidden="true" hidden inert>
            <button id="manual-summarize-floating-btn" title="대화 요약">요약</button>
            <button id="obs-note-floating-btn" title="Obsidian 노트 패널 열기/닫기">노트</button>
            <button id="mood-toggle-floating-btn" title="기분 상태">기분</button>
            <button id="promise-reminders-floating-btn" title="예정된 대화 약속">예정</button>
            <button id="proactive-conversations-floating-btn" title="예약된 선제 대화" aria-label="예약된 선제 대화">선제</button>
            <button id="goal-toggle-floating-btn" title="에네 목표" aria-label="에네 목표">목표</button>
            <button id="life-records-floating-btn" type="button" title="생활 기록" aria-label="생활 기록" aria-controls="life-records-panel" aria-expanded="false">생활</button>
            <button id="live2d-parameters-floating-btn" type="button" title="Live2D 파라미터" aria-label="Live2D 파라미터">Live2D</button>
            <button id="settings-floating-btn" type="button" title="설정 열기" aria-label="설정 열기">
                <svg class="lucide-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>
    </div>
    <section id="life-records-panel" class="hidden" role="region" aria-labelledby="life-records-panel-title">
        <header id="life-records-panel-header">
            <div id="life-records-panel-title">생활 기록</div>
            <button id="life-records-close-btn" type="button" title="닫기" aria-label="생활 기록 닫기">×</button>
        </header>
        <div id="life-records-date-controls">
            <button id="life-records-previous-btn" type="button" aria-label="이전 날짜">‹</button>
            <input id="life-records-date-input" type="date" aria-label="생활 기록 날짜">
            <button id="life-records-next-btn" type="button" aria-label="다음 날짜">›</button>
            <button id="life-records-today-btn" type="button">오늘</button>
        </div>
        <div id="life-records-status" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="life-records-list"></div>
    </section>
    <div id="promise-reminders-panel" class="hidden" aria-live="polite">
        <div id="promise-reminders-panel-header">
            <div id="promise-reminders-panel-title">예정</div>
            <button id="promise-reminders-close-btn" type="button" title="닫기" aria-label="닫기">×</button>
        </div>
        <div id="promise-reminders-list"></div>
    </div>
    <div id="proactive-conversations-panel" class="hidden" aria-live="polite">
        <div id="proactive-conversations-panel-header">
            <div id="proactive-conversations-panel-title">선제 대화</div>
            <button id="proactive-conversations-close-btn" type="button" title="닫기" aria-label="닫기">×</button>
        </div>
        <div id="proactive-conversations-list"></div>
    </div>
    <div id="goal-status-panel" class="hidden" aria-live="polite">
        <div id="goal-status-panel-header">
            <div id="goal-status-panel-title">목표</div>
            <button id="goal-status-close-btn" type="button" title="닫기" aria-label="닫기">×</button>
        </div>
        <div id="goal-status-list"></div>
    </div>
    <div id="live2d-parameters-panel" class="hidden" aria-live="polite">
        <div id="live2d-parameters-panel-header">
            <div id="live2d-parameters-panel-title">Live2D 파라미터</div>
            <button id="live2d-parameters-close-btn" type="button" title="닫기" aria-label="닫기">×</button>
        </div>
        <div id="live2d-parameters-warning">장식 조절용입니다. 표정, 눈, 입, 머리, 몸 움직임 관련 파라미터는 표정/립싱크/쓰다듬기와 충돌할 수 있으므로 건드리지 않는 것을 추천합니다.</div>
        <input id="live2d-parameters-search" type="search" placeholder="파라미터 검색" aria-label="파라미터 검색">
        <div id="live2d-parameters-tabs" role="tablist">
            <button id="live2d-parameters-tab-all" class="live2d-parameters-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="live2d-parameters-list" data-live2d-parameter-tab="all">전체</button>
            <button id="live2d-parameters-tab-favorites" class="live2d-parameters-tab" type="button" role="tab" aria-selected="false" aria-controls="live2d-parameters-list" data-live2d-parameter-tab="favorites">즐겨찾기</button>
        </div>
        <div id="live2d-parameters-list" role="tabpanel" aria-labelledby="live2d-parameters-tab-all"></div>
        <div id="live2d-parameters-actions">
            <button id="live2d-parameters-reset-btn" type="button">초기화</button>
            <button id="live2d-parameters-save-btn" type="button">저장</button>
        </div>
    </div>
    <div id="mood-status-widget" class="hidden" aria-live="polite">
        <div id="mood-status-header">
            <div id="mood-status-label">기분: 로딩 중</div>
            <button id="mood-status-collapse-btn" type="button" title="접기">_</button>
        </div>
        <div id="mood-status-meters">
            <div class="mood-meter-row">
                <span id="mood-meter-name-valence" class="mood-meter-name">긍정</span>
                <div class="mood-meter-track"><div id="mood-meter-valence" class="mood-meter-fill mood-meter-fill-valence"></div></div>
            </div>
            <div class="mood-meter-row">
                <span id="mood-meter-name-bond" class="mood-meter-name">친밀</span>
                <div class="mood-meter-track"><div id="mood-meter-bond" class="mood-meter-fill"></div></div>
            </div>
            <div class="mood-meter-row">
                <span id="mood-meter-name-energy" class="mood-meter-name">활력</span>
                <div class="mood-meter-track"><div id="mood-meter-energy" class="mood-meter-fill"></div></div>
            </div>
            <div class="mood-meter-row">
                <span id="mood-meter-name-stress" class="mood-meter-name">긴장</span>
                <div class="mood-meter-track"><div id="mood-meter-stress" class="mood-meter-fill mood-meter-fill-stress"></div></div>
            </div>
        </div>
        <div id="mood-status-details" style="min-height: 72px; margin-top: 8px;">
            <div id="mood-detail-primary-row" class="mood-meter-row">
                <span id="mood-detail-primary-label" class="mood-meter-name" style="width: 48px;">주 감정</span>
                <span id="mood-detail-primary" style="font-size: 11px;"></span>
            </div>
            <div id="mood-detail-secondary-row" class="mood-meter-row hidden" hidden style="display: none;">
                <span id="mood-detail-secondary-label" class="mood-meter-name" style="width: 48px;">보조 감정</span>
                <span id="mood-detail-secondary" style="font-size: 11px;"></span>
            </div>
            <div id="mood-detail-trust-row" class="mood-meter-row">
                <span id="mood-detail-trust-label" class="mood-meter-name" style="width: 48px;">신뢰</span>
                <div class="mood-meter-track"><div id="mood-detail-trust" class="mood-meter-fill" role="meter" aria-labelledby="mood-detail-trust-label"></div></div>
            </div>
        </div>
        <button id="mood-state-reset-btn" type="button" aria-label="기분 상태 초기화" style="width: 100%; min-height: 44px; margin-top: 8px; border: 1px solid var(--ene-floating-panel-border); border-radius: 8px; background: var(--ene-floating-panel-button-bg); color: var(--ene-floating-panel-text); cursor: pointer;">상태 초기화</button>
    </div>

    <div id="summary-confirm-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="summary-confirm-title">
        <div id="summary-confirm-dialog">
            <div id="summary-confirm-title">수동 요약</div>
            <div id="summary-confirm-body">수동 요약을 진행하시겠습니까?</div>
            <div id="summary-confirm-actions">
                <button id="summary-confirm-no" type="button">아니오</button>
                <button id="summary-confirm-yes" type="button">예</button>
            </div>
        </div>
    </div>

    <div id="summary-review-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="summary-review-title">
        <div id="summary-review-dialog">
            <div id="summary-review-header">
                <div>
                    <div id="summary-review-title">요약 확인</div>
                    <div id="summary-review-subtitle">저장 전에 기억 내용을 확인하세요.</div>
                </div>
                <button id="summary-review-close" type="button" aria-label="닫기">×</button>
            </div>
            <label class="summary-review-field">
                <span>요약</span>
                <textarea id="summary-review-textarea" rows="6"></textarea>
            </label>
            <div class="summary-review-grid">
                <label class="summary-review-field">
                    <span>기억 유형</span>
                    <select id="summary-review-memory-type">
                        <option value="fact">fact</option>
                        <option value="preference">preference</option>
                        <option value="promise">promise</option>
                        <option value="event">event</option>
                        <option value="relationship">relationship</option>
                        <option value="task">task</option>
                        <option value="general">general</option>
                    </select>
                </label>
                <label class="summary-review-field">
                    <span>중요도 이유</span>
                    <select id="summary-review-importance-reason">
                        <option value="none">none</option>
                        <option value="user_marked">user_marked</option>
                        <option value="promise">promise</option>
                        <option value="repeated_topic">repeated_topic</option>
                        <option value="long_term_preference">long_term_preference</option>
                    </select>
                </label>
                <label class="summary-review-field">
                    <span>신뢰도</span>
                    <input id="summary-review-confidence" type="number" min="0" max="1" step="0.01">
                </label>
                <label class="summary-review-field">
                    <span>엔티티</span>
                    <input id="summary-review-entities" type="text">
                </label>
            </div>
            <div class="summary-review-section">
                <div class="summary-review-section-title">
                    <span>사용자 정보</span>
                    <button id="summary-review-add-user-fact" class="summary-review-add-fact" type="button">추가</button>
                </div>
                <div id="summary-review-user-facts" class="summary-review-facts"></div>
            </div>
            <div class="summary-review-section">
                <div class="summary-review-section-title">
                    <span>에네 정보</span>
                    <button id="summary-review-add-ene-fact" class="summary-review-add-fact" type="button">추가</button>
                </div>
                <div id="summary-review-ene-facts" class="summary-review-facts"></div>
            </div>
            <div class="summary-review-section">
                <div class="summary-review-section-title">
                    <span>주제 기억 후보</span>
                </div>
                <div id="summary-review-topic-hints" class="summary-review-topic-hints"></div>
            </div>
            <div id="summary-review-actions">
                <button id="summary-review-cancel" type="button">취소</button>
                <button id="summary-review-regenerate" type="button">재생성</button>
                <button id="summary-review-save" type="button">저장</button>
            </div>
        </div>
    </div>

    <div id="attachment-delete-confirm-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="attachment-delete-confirm-body">
        <div id="attachment-delete-confirm-dialog">
            <div id="attachment-delete-confirm-body">지운 사진은 컨텍스트에 포함되지 않습니다.
정말 지우시겠습니까?</div>
            <div id="attachment-delete-confirm-actions">
                <button id="attachment-delete-confirm-no" type="button">아니오</button>
                <button id="attachment-delete-confirm-yes" type="button">예</button>
            </div>
        </div>
    </div>

    <div id="image-lightbox-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="확대된 이미지 보기">
        <button id="image-lightbox-close" type="button" aria-label="이미지 확대 닫기">×</button>
        <img id="image-lightbox-image" alt="확대된 이미지">
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- 로컬 JavaScript 라이브러리 사용 -->
    <script src="lib/pixi.min.js"></script>
    <script src="lib/live2dcubismcore.min.js"></script>
    <script src="lib/pixi-live2d-display.min.js"></script>

    <!-- QWebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <!-- ENE 런타임 스크립트: classic script 순서가 전역 바인딩 순서입니다. -->
    <script src="runtime_bootstrap.js"></script>
    <script src="runtime_live2d_model.js"></script>
    <script src="runtime_image_avatar.js"></script>
    <script src="runtime_motion_state.js"></script>
    <script src="runtime_gesture_engine.js"></script>
    <script src="runtime_head_pat.js"></script>
    <script src="runtime_auto_blink_tracking.js"></script>
    <script src="runtime_expression.js"></script>
    <script src="runtime_chat_state.js"></script>
    <script src="runtime_ui_strings.js"></script>
    <script src="runtime_attachments.js"></script>
    <script src="runtime_chat_panel_controls.js"></script>
    <script src="runtime_promise_panel.js"></script>
    <script src="runtime_goal_panel.js"></script>
    <script src="runtime_life_record_panel.js"></script>
    <script src="runtime_message_helpers.js"></script>
    <script src="runtime_mood_obsidian.js"></script>
    <script src="runtime_message_rendering.js"></script>
    <script src="runtime_chat_flow.js"></script>
    <script src="runtime_bridge.js"></script>
    <script src="runtime_lipsync.js"></script>
    <script src="runtime_live2d_parameter_core.js"></script>
    <script src="runtime_live2d_parameter_ui.js"></script>
    <script src="runtime_live2d_parameters.js"></script>
    <script src="script.js"></script>
</body>

</html>
