name: Source publication checks

on:
  # 소스만 검사한다. 과거 태그의 workflow는 원격 갱신 전에 별도 중지해야 한다.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 소스 실행부 검사
        run: python tools/export_companion_character.py --check
